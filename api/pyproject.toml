[project]
name = "ovweb"
version = "0.1.0"
description = "OpenVizsla 3 web UI + Claude-assisted USB protocol analysis"
requires-python = ">=3.11"

dependencies = [
    "ijson>=3.2",                 # streaming JSON parse of multi-GB tshark output (class-aware decoders)
    "fastapi>=0.115",             # Phase 4: REST + WebSocket
    "uvicorn[standard]>=0.30",    # websockets/httptools extras
    "pyusb>=1.3",                 # Phase 4.6: USB device enumeration for UI picker
    # Phase 5+ (Claude tool-use) will add anthropic.
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
decode-session = "ovweb.cli.decode_session:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovweb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
